name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 子路径部署：base 必须等于仓库名
env:
  VITE_BASE: /${{ github.event.repository.name }}/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ env.VITE_BASE }}

      - name: Verify build output
        run: node scripts/check-dist.mjs
        env:
          VITE_BASE: ${{ env.VITE_BASE }}

      # GitHub Pages 没有服务端回退：把 index.html 复制成 404.html 兜住深链接
      - name: SPA fallback
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
